name: monitoring_client
description: Monitoring System — Mobile Client App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.1

  # Local storage for JWT tokens
  shared_preferences: ^2.3.1

  # State management
  provider: ^6.1.2

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Kiosk mode: QR code for the visitor sign-in link
  qr_flutter: ^4.1.0

  # Kiosk mode: TV channel playback
  video_player: ^2.9.2
  chewie: ^1.8.5
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
