# Ministry of Planning and Investment - Reception/Monitoring System
# Public port 9046 -> dashboard static + /api proxied to Node on 127.0.0.1:9047
server {
    listen 9046;
    server_name 188.166.8.72;

    client_max_body_size 20m;
    access_log /var/log/nginx/minister_reception_access.log;
    error_log  /var/log/nginx/minister_reception_error.log;

    root /var/www/MinisterReceptionSystem/clientServerSystem/monitoring-system/dashboard/dist;
    index index.html;

    # --- compression (site-local; global gzip_types is disabled) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/javascript application/x-javascript text/javascript
               text/css application/json application/wasm image/svg+xml
               application/manifest+json application/vnd.ms-fontobject
               font/ttf font/otf font/woff font/woff2;

    location /api/ {
        proxy_pass http://127.0.0.1:9047/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Dashboard build assets: content-hashed filenames -> cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /app/ {
        alias /var/www/MinisterReceptionSystem/flutter-web/;
        try_files $uri $uri/ /app/index.html;
    }

    # Flutter entry points must always revalidate (service worker handles the rest)
    location = /app/index.html {
        alias /var/www/MinisterReceptionSystem/flutter-web/index.html;
        add_header Cache-Control "no-cache";
    }
    location = /app/flutter_service_worker.js {
        alias /var/www/MinisterReceptionSystem/flutter-web/flutter_service_worker.js;
        add_header Cache-Control "no-cache";
    }
    location = /app/version.json {
        alias /var/www/MinisterReceptionSystem/flutter-web/version.json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
